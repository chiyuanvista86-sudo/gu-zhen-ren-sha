name: Build, test and publish
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    name: Test and compile offline game
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run check
      - name: Package standalone game
        run: |
          cp README.md dist/README.md
          cp CHANGELOG.md dist/CHANGELOG.md
          cd dist
          zip -r ../gu-zhen-ren-sha-web.zip .
      - uses: actions/upload-artifact@v4
        with:
          name: gu-zhen-ren-sha-web
          path: dist/
      - uses: actions/upload-pages-artifact@v3
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        with:
          path: dist/
      - uses: actions/upload-artifact@v4
        with:
          name: gu-zhen-ren-sha-release
          path: gu-zhen-ren-sha-web.zip
  deploy:
    name: Deploy GitHub Pages
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v4
  release:
    name: Publish downloadable game
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: gu-zhen-ren-sha-release
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          cat > release-notes.md <<'EOF'
          新增升仙对决：1v1 对战 AI、一至五转修炼、升仙准备轮、升仙地劫和每三轮一次的递增灾劫。

          元石与仙缘全部在本局获取和消耗；账号仅解锁人物及完整专属体系。四名人物、十二种通用蛊方、六项通用杀招，包含仙蛊、耐久、拆蛊、升炼、维修和护劫屏障。保留经典身份局与独立存档。

          下载 ZIP，解压后双击 index.html 即可离线游玩。CULTIVATION.md / CULTIVATION.json 列出新模式实际规则、卡牌编号和修改字段，CHANGELOG.md 记录本次改动。当前为规则原型，数值仍需试玩平衡。
          EOF
          gh release create "$RELEASE_TAG" gu-zhen-ren-sha-web.zip --title "蛊真人杀 $RELEASE_TAG · 升仙对决" --notes-file release-notes.md
